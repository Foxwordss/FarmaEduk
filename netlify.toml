[build]
  publish = "frontend"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/.netlify/functions/api/auth/login"
  status = 200

[[redirects]]
  from = "/medicacoes"
  to = "/.netlify/functions/api/medicacoes"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/login"
  to = "/"
  status = 302

[[redirects]]
  from = "/login-admin"
  to = "/html/login-admin.html"
  status = 200

[[redirects]]
  from = "/login-aluno"
  to = "/html/login-aluno.html"
  status = 200

[[redirects]]
  from = "/cadastro"
  to = "/html/cadastro.html"
  status = 200

[[redirects]]
  from = "/medicamentos"
  to = "/html/medicamentos.html"
  status = 200

[[redirects]]
  from = "/filtros"
  to = "/html/filtros.html"
  status = 200

[[redirects]]
  from = "/excluir-medicamentos"
  to = "/html/excluir-medicamentos.html"
  status = 200

[[redirects]]
  from = "/saldo-total"
  to = "/html/saldo-total.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/html/login.html"
  status = 200
